<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPL · หน้าหลัก Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: the real CPL Lead Tracker, one step further – calm, working, numbers first
   IDEA: the sales report sheet (OPEN DATE … INCOME NET) turned into a job card a salesperson fills in 20 seconds
   PICTURE: the home of each role – target meter + "ลงงาน" button for sales, team board for the head
   COLOUR and TYPE: CPL blue sidebar (#0b8fd6→#0b4f8f), white work surface, green = money in, red = pending; Noto Sans Thai
   LAYOUT: sidebar + top bar + role home; dialogs for job entry; narrow screens stack */
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#0f1722);--card:light-dark(#fff,#172231);--ink:light-dark(#1f2d3d,#e6edf5);--mu:light-dark(#62768c,#93a4b8);--bd:light-dark(#e3eaf2,#26354a);--fld:light-dark(#eef3f9,#1d2b3d);--pr:#0096d6;--pr2:#0b4f8f;--ok:#2f9e44;--er:#e03131;--wa:#e8a33a;--vi:#7048e8;--zb:light-dark(#f8fafc,#1a2636)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Thai',system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.sb{width:232px;flex:none;background:linear-gradient(180deg,#0b8fd6,#0b4f8f);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.lg{height:56px;background:#fff;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:#0b4f8f;font-weight:800;letter-spacing:1px}
.gh{font-size:12px;opacity:.72;margin:12px 12px 4px;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#fff;background:none;border:0;text-align:left;cursor:pointer;width:100%;font-size:14.5px}
.nv:hover{background:rgba(255,255,255,.12)}.nv.on{background:#fff;color:#0b6fb0;font-weight:700}
.nv svg{width:18px;height:18px;flex:none}.nv .bd{margin-left:auto;background:var(--er);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px}
.mn{flex:1;display:flex;flex-direction:column}
.tb{min-height:62px;display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.srch{flex:1;max-width:460px;height:42px;border-radius:14px;background:var(--fld);border:0;padding:0 14px}
.role{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--mu)}
.role select{height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:0 10px;font-weight:600;color:var(--ink)}
.ct{padding:22px 24px 40px;max-width:1360px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:9px 15px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--bd);cursor:pointer;white-space:nowrap;min-height:40px}
.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}.btn.ok{background:#e6f4ea;color:#137333;border-color:#b7dcc4}.btn.sm{min-height:32px;padding:4px 11px;font-size:13px;border-radius:10px}
.btn:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(0,150,214,.45);outline-offset:2px}
h1{font-size:24px;margin:0;line-height:1.2}.sub{color:var(--mu);font-size:13.5px}
.hrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.hrow .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.big{font-size:16px;padding:13px 22px;border-radius:14px;box-shadow:0 6px 18px rgba(0,150,214,.28)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px}
.pn h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px}.pn h3 .r{margin-left:auto;font-weight:600;font-size:13px;color:var(--pr);cursor:pointer;background:none;border:0}
.k{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 16px;border-left:5px solid var(--c)}.k b{display:block;font-size:clamp(20px,2.2vw,26px);color:var(--c);line-height:1.25;white-space:nowrap}.k span{font-size:13px;color:var(--mu)}
.tgt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:end}
.tgt .v{font-size:clamp(30px,4vw,44px);font-weight:800;line-height:1.05;color:var(--ok);white-space:nowrap}
.meter{grid-column:1/-1;position:relative;height:18px;border-radius:99px;background:var(--fld);margin:14px 0 16px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#40c057,#2f9e44);transition:width .6s}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.meter u em{position:absolute;top:24px;left:0;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--mu);white-space:nowrap}
.due{width:64px;flex:none;text-align:center;border-radius:10px;padding:5px 0;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);line-height:1.2}.due b{display:block;font-size:15px}.due span{font-size:11px;font-weight:700}
.shr{font-size:12px;font-weight:700;color:#7048e8;background:light-dark(#f1ecff,#2a2045);border-radius:99px;padding:1px 8px;white-space:nowrap}
.jlk{border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;color:var(--ink);display:block;text-align:left}.jlk:hover .jno{background:light-dark(#dbeefb,#1d3a52)}
.lnk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:14px;background:light-dark(#eaf7ee,#16301f);padding:10px 12px;margin:-4px 0 14px;font-size:13.5px}.lnk b{color:#2f9e44}.lnk button{margin-left:auto}
.jno{font:700 13px ui-monospace,Menlo,monospace;background:var(--fld);border-radius:7px;padding:1px 7px;white-space:nowrap}
.info{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;border-radius:14px;background:light-dark(#eef6fc,#14283a);padding:10px 16px;margin-bottom:14px;font-size:14px;color:var(--ink)}.info>b{color:#0b6fb0}.info>i{color:var(--mu);font-style:normal}
.alert{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;border-radius:16px;background:light-dark(#fff4e6,#3a2512);border:1px solid #f5c48a;padding:12px 16px;margin-bottom:14px;font-size:14px}.alert b{color:#c25e00}.alert span{display:flex;gap:6px;flex-wrap:wrap}.jlink{border:0;background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:inset 0 0 0 1px #f5c48a}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 6px}.tiers div{border-radius:12px;background:var(--fld);padding:8px 10px;font-size:12.5px}.tiers b{display:block;font-size:14px;white-space:nowrap}.tiers span{color:var(--mu)}.tiers .on{background:#e6f4ea;color:#137333;box-shadow:inset 0 0 0 2px #2f9e44}.tiers .on span{color:#137333}
.paysum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.paysum b{display:block;font-size:22px;white-space:nowrap}.paysum span{font-size:12.5px;color:var(--mu)}
.pbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--fld);margin:10px 0 6px}.pbar b{background:#2f9e44}.pbar i{background:#e03131}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}
.row .t{width:58px;flex:none;font-weight:700;font-size:13px;color:#0b6fb0}.row .t.l{color:var(--er)}
.row h4{margin:0;font-size:14.5px}.row .s{font-size:12.5px;color:var(--mu)}.row .a{margin-left:auto;display:flex;gap:6px;flex:none}
.code{display:inline-block;font:700 12px ui-monospace,Menlo,monospace;border-radius:7px;padding:2px 7px;color:#fff;background:var(--c,#555)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--c);white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}.st:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pay{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap;border:0;cursor:pointer}.pay.d{background:#e6f4ea;color:#137333}.pay.p{background:#fde4e1;color:#c92a2a}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;color:#fff;background:var(--c);white-space:nowrap}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:14px;cursor:pointer}.ck:last-child{border:0}
.ck i{width:20px;height:20px;border-radius:6px;border:2px solid #b9c6d4;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:13px}.ck.y i{background:var(--ok);border-color:var(--ok)}
.ck .pb{margin-left:auto;width:90px;height:7px;border-radius:99px;background:var(--fld);overflow:hidden;flex:none}.ck .pb b{display:block;height:100%;background:var(--pr)}.ck em{font-style:normal;font-size:12px;color:var(--mu);width:46px;text-align:right;flex:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12.5px;color:var(--mu);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bd);font-size:14px;white-space:nowrap}tbody tr:nth-child(even){background:var(--zb)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.nm{white-space:normal;min-width:160px}table.jt th,table.jt td{padding:9px 6px}table.jt td{font-size:13px}table.jt td.nm{min-width:140px}
.mono{font:12.5px ui-monospace,Menlo,monospace}
.bar{height:10px;border-radius:99px;background:var(--fld);overflow:hidden;min-width:70px}.bar b{display:block;height:100%;border-radius:99px;background:var(--c,var(--ok))}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-size:13.5px;color:var(--mu);cursor:pointer;min-height:34px}.seg .on{background:var(--pr);color:#fff;font-weight:700}
.trend{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.trend i{width:100%;max-width:34px;border-radius:7px 7px 0 0;background:var(--c,var(--pr))}.trend span{font-size:11.5px;color:var(--mu)}
/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:min(760px,96vw);background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:visible}
dialog::backdrop{background:rgba(15,35,56,.45)}
.dx{position:absolute;left:calc(100% + 10px);top:0;width:40px;height:40px;border-radius:50%;background:#fff;color:#1f2d3d;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:16px;font-weight:700;cursor:pointer}
@media(max-width:860px){.dx{left:auto;right:8px;top:8px;box-shadow:none;background:var(--fld);color:var(--ink)}}
.dlg{padding:20px 22px;max-height:90vh;overflow:auto}
.dlg h2{margin:0 0 2px;font-size:20px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13.5px;font-weight:600;color:var(--mu)}
.f>span .rq{color:var(--er)}
.in{height:44px;border-radius:12px;background:var(--fld);border:0;padding:0 12px;font-size:16px;color:var(--ink);width:100%}
textarea.in{height:70px;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:0;border-radius:99px;padding:7px 13px;background:var(--fld);cursor:pointer;font-size:13.5px;min-height:36px;color:var(--ink)}.chips button.on{background:var(--pr);color:#fff;font-weight:700}
.svg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}@media(max-width:600px){.svg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svg button{border:2px solid transparent;border-radius:14px;background:var(--fld);padding:9px 10px;text-align:left;cursor:pointer;min-height:56px;color:var(--ink)}.svg button b{display:block;font-size:14px}.svg button span{font-size:12px;color:var(--mu)}.svg button.on{border-color:var(--pr);background:light-dark(#e7f5fc,#123248)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:600px){.two,.three{grid-template-columns:1fr}}
.sug{position:relative}.sug ul{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:3;max-height:240px;overflow:auto}
.sug li{padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink)}.sug li:hover,.sug li.on{background:var(--fld)}.ltag{font-size:11px;color:#fff;background:#e8a33a;border-radius:6px;padding:1px 6px;margin-right:6px}.sug li span{display:block;font-size:12px;color:var(--mu);font-weight:400}
.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:14px;background:light-dark(#e7f5fc,#123248);padding:10px 12px;margin:-4px 0 14px;font-size:13.5px}
.sum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:14px;margin-top:4px}.sum .code{font-size:14px;padding:4px 10px}
details summary{cursor:pointer;font-weight:700;color:var(--pr);margin:2px 0 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}.toast.on{opacity:1}
.empty{text-align:center;color:var(--mu);padding:22px 0;font-size:14px}
.note{font-size:12.5px;color:var(--mu);margin-top:18px}
@media(max-width:600px){.row{flex-wrap:wrap}.row .a{width:100%;justify-content:flex-end}}
.mnav{display:none;gap:6px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto}.mnav button{flex:none}
@media(max-width:860px){.mnav{display:flex}.sb{display:none}.ct{padding:16px 14px 40px}.tb{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
.sb,.mnav{display:none!important}.tb{position:static;background:none;border:0;min-height:0;padding:16px 28px 0}.ct{max-width:none;padding:12px 28px 40px}body{background:var(--bg)}
.ro{font-size:11px;font-weight:700;color:#0b6fb0;background:light-dark(#e7f5fc,#123248);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tabs2{display:flex;gap:2px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
 <nav class="sb" id="sb" hidden></nav>
 <div class="mn">
  <header class="tb">
   <label class="role">ดูในมุมของ<select id="role" aria-label="ตำแหน่ง"></select></label>
  </header>
  <div class="mnav" id="mnav"></div>
  <main class="ct" id="ct"></main>
 </div>
</div>

<dialog id="dj" aria-labelledby="djt"><button class="dx" data-close aria-label="ปิด">✕</button><form class="dlg" id="fj" novalidate></form></dialog>
<dialog id="dc" aria-labelledby="dct"><button class="dx" data-close aria-label="ปิด">✕</button><form class="dlg" id="fc" novalidate></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(v,d=0)=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const B=v=>'฿ '+N(Math.round(v));
const TODAY=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
const MLBL=new Date().toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const DLBL=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)};

/* ---------- reference lists (from the TEXT sheet) ---------- */
const MODES=[['AX','Courier Express','พัสดุด่วน'],['AE','Courier Economy','พัสดุประหยัด'],['AD','Document','เอกสาร'],['AG','Air Cargo','ทางอากาศ'],['TL','Truck LTL','รถ · ไม่เต็มคัน'],['TF','Truck FTL','รถ · เต็มคัน'],['SL','Sea LCL','เรือ · ไม่เต็มตู้'],['SF','Sea FCL','เรือ · เต็มตู้']];
const SCOL=c=>c==='DOM'?'#868e96':c[1]==='A'?(c[0]==='E'?'#0096d6':'#7048e8'):c[1]==='T'?(c[0]==='E'?'#2f9e44':'#40a058'):'#0b7285';
const CTY=[['USA','สหรัฐฯ'],['DEU','เยอรมนี'],['JPN','ญี่ปุ่น'],['SGP','สิงคโปร์'],['MYS','มาเลเซีย'],['GBR','อังกฤษ'],['CHN','จีน'],['AUS','ออสเตรเลีย'],['VNM','เวียดนาม'],['LAO','ลาว'],['FRA','ฝรั่งเศส'],['CAN','แคนาดา'],['NZL','นิวซีแลนด์'],['CHE','สวิตเซอร์แลนด์'],['KOR','เกาหลีใต้'],['HKG','ฮ่องกง'],['TWN','ไต้หวัน'],['IND','อินเดีย'],['ARE','สหรัฐอาหรับฯ'],['THA','ไทย']];
const CH=['LINE@','LINE Private','FB PAGE','FB Private','CALL-IN','WHATAPP','E-MAIL','WEBSITE','WALK-IN (PLAZA)','WALK-IN (MIXT)','TIKTOK'];
const BR=['CPL','IMTH','CLMV','CPLExJJ','CPLExDEU','CPLExUSA','CPLExGBP','OVERSEA'];
const PT=['SPARE PART','CLOTHES','BEAUTY&PERSONAL CARE','INSTANT FOOD','PERSONAL EFFECT','ELECTRONIC','INDUSTRY EQUIPMENT','FASHION ACCESSORY','FOOD SUPPLEMENT','DECORATION','TOOLS','OTHER'];
const STS=['OPEN','DROP OFF','PICKUP','PACKED','BOOKING','BOOKED','RELEASED'];
const STC={OPEN:'#868e96','DROP OFF':'#e8a33a',PICKUP:'#e8a33a',PACKED:'#e8a33a',BOOKING:'#0096d6',BOOKED:'#1864ab',RELEASED:'#2f9e44',CANCELED:'#c92a2a'};

/* ---------- people & targets (sample; November figures match DATA SALES 2026 / Weekly) ---------- */
const HB=(()=>{try{return parent!==window&&parent.HB}catch(e){return null}})();
const ST=HB?HB.ST:{Y:'ปิดการขาย',N:'ยังไม่สนใจบริการ',S:'รอการตัดสินใจ',H:'มีโอกาสเปลี่ยนใจ'};
let SALES=[],CUS=[],J=[],LD=[],seq=1,ROLES=[],DBERR='';const CB={},CKD={HO:[],BR:[]};
const comm=(v,s)=>!s.sal?[0,0]:v>=s.t2?[2,v*.02]:v>=s.t1?[1,v*.01]:[0,0];
const MK=[],MON=[];{const d=new Date();d.setDate(1);for(let i=8;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);MK.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));MON.push(x.toLocaleDateString('th-TH',{month:'short'}))}}
const CUR=MK[8],inM=(j,k)=>(j.close||j.open||'').startsWith(k);

 <div class="f sug"><span>ลูกค้า <b class="rq">*</b></span><input class="in" id="jcus" autocomplete="off" value="${esc(F.cus)}" placeholder="พิมพ์ชื่อหรือรหัสลูกค้า"><ul id="jsug" hidden></ul></div>
 ${F.lead?(l=>!l?'':`<div class="lnk"><b>Lead</b>${esc(l.n)} · ${esc(l.ads)} · ${fd(l.in)}<button type="button" class="btn sm" data-unl>ยกเลิกการเชื่อม</button></div>`)(LD.find(x=>String(x.id)===String(F.lead))):''}${F._hint?`<div class="hint">ลูกค้าเก่า · ${esc(F._hint)}<button type="button" class="btn sm" data-rep>ใช้ข้อมูลงานล่าสุด</button></div>`:''}
 <div class="f"><span>บริการ <b class="rq">*</b></span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><div class="seg"><button type="button" class="${F.io==='E'&&F.mode!=='DOM'?'on':''}" data-io="E">ส่งออก</button><button type="button" class="${F.io==='I'&&F.mode!=='DOM'?'on':''}" data-io="I">นำเข้า</button><button type="button" class="${F.mode==='DOM'?'on':''}" data-io="D">ในประเทศ</button></div></div>
 ${F.mode==='DOM'?'':`<div class="svg">${MODES.map(([k,t,d])=>`<button type="button" class="${F.mode===k?'on':''}" data-md="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>`}</div>
 <div class="f"><span>ประเทศ <b class="rq">*</b></span><div class="chips">${top.map(([k,t])=>`<button type="button" class="${F.cty===k?'on':''}" data-cty="${k}">${t}</button>`).join('')}<select class="in" id="jcty" style="width:auto;height:36px;border-radius:99px;font-size:14px"><option value="">ประเทศอื่น…</option>${CTY.slice(8).map(([k,t])=>`<option value="${k}"${F.cty===k?' selected':''}>${t} · ${k}</option>`).join('')}</select></div></div>
 <div class="three"><div class="f"><span>Job No. <b class="rq">*</b></span><input class="in" id="jno" value="${esc(F.job||nextNo())}" style="font-family:ui-monospace,Menlo,monospace;font-weight:700"></div><div class="f"><span>วันที่เปิดงาน</span><input class="in" type="date" id="jopen" value="${F.open}"></div><div class="f"><span>Close Date <b class="rq">*</b></span><input class="in" type="date" id="jclose" value="${F.close}"></div></div>
 <div class="two"><div class="f"><span>Owner <b class="rq">*</b></span><select class="in" id="jsl">${SALES.map(x=>`<option value="${x.id}"${F.s===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="f"><span>Assistant</span><select class="in" id="jas"><option value="">ไม่มี</option>${SALES.filter(x=>x.id!==F.s).map(x=>`<option value="${x.id}"${F.as===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div>
 <div class="two"><div class="f"><span>รายได้ (บาท)</span><input class="in" id="jinc" inputmode="decimal" value="${F.inc?N(F.inc,2):''}"></div><div class="f"><span>รายได้สุทธิ</span><input class="in" id="jnet" inputmode="decimal" value="${F.net?N(F.net,2):''}"></div></div>
 <div class="two"><div class="f"><span>สถานะงาน</span><div class="chips">${STS.map(x=>`<button type="button" class="${F.st===x?'on':''}" data-st="${x}">${x}</button>`).join('')}</div></div><div class="f"><span>การชำระเงิน</span><div class="chips"><button type="button" class="${F.pay==='d'?'on':''}" data-py="d">ชำระแล้ว</button><button type="button" class="${F.pay==='p'?'on':''}" data-py="p">ค้างชำระ</button></div></div></div>
 <details${F._edit?' open':''}><summary>รายละเอียดเพิ่มเติม</summary>
 <div class="three"><div class="f"><span>SO / SJ</span><input class="in" id="jso" value="${esc(F.so)}"></div>
 <div class="f"><span>ช่องทาง</span><select class="in" id="jch"><option value="">—</option>${CH.map(x=>`<option${F.ch===x?' selected':''}>${x}</option>`).join('')}</select></div><div class="f"><span>สาขา</span><select class="in" id="jbr">${BR.map(x=>`<option${F.br===x?' selected':''}>${x}</option>`).join('')}</select></div><div class="f"><span>ประเภทสินค้า</span><select class="in" id="jpt"><option value="">—</option>${PT.map(x=>`<option${F.pt===x?' selected':''}>${x}</option>`).join('')}</select></div>
 <div class="f"><span>ที่มา</span><select class="in" id="jsrc">${['',...new Set(['ลูกค้าเก่า',...LD.map(l=>l.ads),'Ads: Inbox','CALL-IN','WALK-IN (PLAZA)',F.src].filter(Boolean))].map(x=>`<option${F.src===x?' selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="f"><span>AWB / BL No.</span><input class="in" id="jawb" value="${esc(F.awb)}"></div><div class="f" style="grid-column:span 2"><span>หมายเหตุ</span><input class="in" id="jrem" value="${esc(F.remark)}"></div></div></details>
 <div class="sum"><span class="code" style="--c:${SCOL(svCode())}">${svCode()}</span><span>${F.cty||'—'}</span><span class="sub">${F.no?('ลูกค้า'+F.no):''}</span><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn p" type="submit">บันทึก</button></span></div>`;
}
const pnum=v=>+String(v).replace(/[^\d.]/g,'')||0;
function pickCus(c,q){F.cus=c.n;F.code=c.code;F.cid=c.id;F.ch=c.ch;F.br=c.br;F.no=J.some(j=>j.cus===c.n)?'เก่า':'ใหม่';F.src=F.no==='เก่า'?'ลูกค้าเก่า':(c.leadSrc||'');F.lead=c.leadId||'';F._last=c.last;F._hint=c.last?`ส่งล่าสุด ${c.last.sv} · ${c.last.c}`:'';if(!q)drawJob()}
function pickLead(l,q){F.cus=l.n;F.lead=l.id;F.src=l.ads;F.ch=l.ch;F.no='ใหม่';F.io=l.sv[0]==='D'?'E':l.sv[0];F.mode=l.sv==='DOM'?'DOM':l.sv.slice(1);F.cty=l.cty;F.s=F.s||l.s;F._hint='';F.code='';F.cid=l.cid||null;if(!q)drawJob()}
const nextNo=()=>TODAY.slice(2,4)+TODAY.slice(5,7)+'-'+String(seq).padStart(4,'0');
const fj=$('fj');
fj.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='jcus'){F.cus=t.value;F._hint='';F.cid=null;F.no=t.value?'ใหม่':'';if(F.lead){F.lead='';F.src=''}const q=t.value.trim().toLowerCase(),ul=$('jsug');const L=q?CUS.filter(c=>c.n.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)).slice(0,5):[];const LL=q?LD.filter(l=>!J.some(j=>j.lead===l.id)&&l.n.toLowerCase().includes(q)).slice(0,4):[];ul.hidden=!(L.length+LL.length);ul.innerHTML=[...LL.map(l=>`<li data-li="${l.id}"><b class="ltag">Lead</b>${esc(l.n)}<span>${fd(l.in)} · ${esc(l.ads)} · ${esc(l.st)} · ${esc(l.s)}</span></li>`),...L.map(c=>`<li data-cu="${CUS.indexOf(c)}">${esc(c.n)}<span>${c.last?`ส่งล่าสุด ${c.last.sv} ${c.last.c}`:'ลูกค้า'} · ${esc(c.s)}</span></li>`)].join('');const f=ul.querySelector('li');if(f)f.classList.add('on')}
 if(t.id==='jinc'){F.inc=pnum(t.value);F.net=vatNet(F.inc,F.br);$('jnet').value=F.inc?N(F.net,2):''}
 if(t.id==='jnet')F.net=pnum(t.value);
 if(t.id==='jclose')F.close=t.value;if(t.id==='jno')F.job=t.value;if(t.id==='jopen')F.open=t.value;
});
fj.addEventListener('change',e=>{const t=e.target;if(t.id==='jsl'){F.s=t.value;if(F.as===F.s)F.as='';drawJob();return}if(t.id==='jas'){F.as=t.value;drawJob();return}const m={jno:'job',jcty:'cty',jopen:'open',jclose:'close',jso:'so',jch:'ch',jbr:'br',jpt:'pt',jawb:'awb',jrem:'remark',jsrc:'src'};if(m[t.id]){F[m[t.id]]=t.value;if(t.id==='jcty'||t.id==='jbr')drawJob()}});
fj.addEventListener('keydown',e=>{if(e.target.id==='jcus'&&e.key==='Enter'){e.preventDefault();const li=$('jsug').querySelector('li.on');if(li&&!$('jsug').hidden){if(li.dataset.li)pickLead(LD.find(x=>String(x.id)===li.dataset.li));else pickCus(CUS[+li.dataset.cu])}}});
fj.addEventListener('click',e=>{const b=e.target.closest('button,li');if(!b)return;const d=b.dataset;
 if(d.li)return pickLead(LD.find(x=>String(x.id)===d.li));if(d.cu!=null)return pickCus(CUS[+d.cu]);if(d.unl!=null){F.lead='';F.src='';drawJob();return}
 if(d.rep!=null){F.io=F._last.sv[0];F.mode=F._last.sv==='DOM'?'DOM':F._last.sv.slice(1);F.cty=F._last.c;F.pt=F._last.pt;F._hint='';drawJob();return}
 if(d.io){if(d.io==='D')F.mode='DOM';else{F.io=d.io;if(F.mode==='DOM')F.mode='AX'}drawJob()}
 else if(d.md){F.mode=d.md;drawJob()}else if(d.cty){F.cty=d.cty;drawJob()}else if(d.st){F.st=d.st;drawJob()}else if(d.py){F.pay=d.py;drawJob()}
});
fj.addEventListener('submit',async e=>{e.preventDefault();
 if(!F.cus.trim()){toast('กรุณาใส่ชื่อลูกค้า');$('jcus').focus();return}
 if(!F.cty){toast('กรุณาเลือกประเทศ');return}
 const no=(F.job||(F._edit?'':nextNo())).trim();if(!no){toast('กรุณาใส่ Job No.');return}
 if(!F.close){toast('กรุณาใส่ Close Date');$('jclose').focus();return}
 const o={job:no,s:F.s,as:F.as||'',lead:F.lead||'',cid:F.cid||null,src:F.src||'',cus:F.cus.trim(),sv:svCode(),cty:F.cty,inc:+F.inc||0,net:+F.net||0,no:F.no||'ใหม่',ch:F.ch,br:F.br,st:F.st,pay:F.pay,open:F.open,close:F.close,pt:F.pt,awb:F.awb,so:F.so,remark:F.remark};
 const btn=fj.querySelector('[type=submit]');btn.disabled=true;
 const sb=HB.sb();
 if(!F._edit&&!o.cid){const ex=CUS.find(c=>c.n.trim().toLowerCase()===o.cus.toLowerCase());if(ex)o.cid=ex.id;else{const{data:c}=await sb.from('customers').insert({name:o.cus,owner:o.s||null}).select('id').single();if(c)o.cid=c.id}}
 const q=F._edit?sb.from('sales_jobs').update(toRow(o)).eq('id',F.id):sb.from('sales_jobs').insert(toRow(o));
 const{error}=await q;
 if(error){btn.disabled=false;toast('บันทึกไม่สำเร็จ: '+error.message);return}
 if(!F._edit&&o.lead&&!F._conv){try{const{data:l}=await sb.from('leads').select('status,deal_amt,detail,customer_id').eq('id',o.lead).single();if(l){const dt={...(l.detail||{})},g=MG(o.sv),sv=g==='Sea'?'Sea':g==='Truck'?'Truck':'Air',dir=o.sv[0]==='I'?'นำเข้า':'ส่งออก',up={status:ST.Y};
  if(!+l.deal_amt&&!(dt.deals||[]).length){up.deal_amt=o.net||o.inc||0;up.deal_date=o.close;dt.cl={dir,svc:sv,cty:cname(o.cty)}}else dt.deals=[...(dt.deals||[]),{d:o.close,a:o.net||o.inc||0,dr:dir,s:sv,c:cname(o.cty)}];
  up.detail=dt;if(!l.customer_id&&o.cid)up.customer_id=o.cid;await sb.from('leads').update(up).eq('id',o.lead)}}catch(e){}}
 btn.disabled=false;
 toast(F._edit?'บันทึกแล้ว':'ลงงาน '+no+' แล้ว');$('dj').close();await reload()});

/* ---------- new customer (quick) ---------- */
let SALID='';
function openSal(id){SALID=id;const s=SALES.find(x=>x.id===id);$('fc').innerHTML=`<h2 id="dct">เงินเดือน · ${esc(id)}</h2><div class="sub" style="margin-bottom:14px">${esc(s.team)}</div><div class="f"><span>เงินเดือน (บาท) <b class="rq">*</b></span><input class="in" id="csal" inputmode="decimal" value="${s.sal?N(s.sal):''}"></div><div class="sum"><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn p" type="submit">บันทึก</button></span></div>`;$('dc').showModal();setTimeout(()=>$('csal').focus(),50)}
$('fc').addEventListener('submit',async e=>{e.preventDefault();const v=pnum($('csal').value);if(!v){toast('กรุณาใส่เงินเดือน');return}
 const{error}=await HB.sb().from('sales_targets').upsert({sales:SALID,salary:v,updated_at:new Date().toISOString()});if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}
 $('dc').close();toast('บันทึกแล้ว');await reload()});
document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.close()})});

/* ---------- page actions ---------- */
$('ct').addEventListener('click',e=>{const sb=e.target.closest('[data-sub]');if(sb){PAGE=sb.dataset.sub;return render()}const b=e.target.closest('[data-nj],[data-nc],[data-adv],[data-pay],[data-ej],[data-go],[data-jv],[data-fil],[data-ck],[data-cbd],[data-ld],[data-lj],[data-lfil],[data-cx],[data-cj],[data-sal]');if(!b)return;const d=b.dataset;
 if(d.nj!=null)return openJob();if(d.lj)return openJob(null,LD.find(x=>String(x.id)===d.lj));if(d.sal)return openSal(d.sal);if(d.lfil){LFIL=d.lfil;return render()}if(d.cx){COPEN=COPEN===d.cx?'':d.cx;return render()}if(d.cj)return openJob(null,null,CUS.find(c=>c.code===d.cj));
 if(d.go){PAGE=d.go;return render()}if(d.jv){JV=d.jv;return render()}if(d.fil){FIL=d.fil;return render()}
 const j=J.find(x=>String(x.id)===(d.adv||d.pay||d.ej));
 if(j&&j.ro&&(d.adv||d.pay))return toast('รายการนี้มาจาก Lead');if(j&&j.ro&&d.ej)return openJob({...j,id:null,job:'',ro:0,_conv:1});
 if(d.adv&&j){const i=STS.indexOf(j.st),st=STS[Math.min(STS.length-1,i+1)];return upd(j,{status:st},()=>{j.st=st;toast(j.job+' → '+st)})}
 if(d.pay&&j){const p=j.pay==='d'?'p':'d';return upd(j,{pay:p},()=>{j.pay=p;toast(j.job+(p==='d'?' ชำระแล้ว':' ค้างชำระ'))})}
 if(d.ej&&j)return openJob(j);
 if(d.ck!=null){const L=CKD[(me()||{}).br==='CPLExJJ'?'BR':'HO'][+d.ck];L[1]=L[1]>=L[2]?0:L[2];return render()}
 if(d.cbd!=null){CB[ROLE].splice(+d.cbd,1);toast('บันทึกผลการโทรแล้ว');return render()}
 if(d.ld!=null){b.closest('.row').remove();toast('ย้ายไปติดตามแล้ว')}
});
async function upd(j,o,ok){const{error}=await HB.sb().from('sales_jobs').update(o).eq('id',j.id);if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}ok();render()}
async function reload(){await loadAll();render()}
(async()=>{
 try{const t=parent.document.documentElement.dataset.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}
 if(!HB||!HB.profile()){$('ct').innerHTML='<div class="empty">ไม่มีสิทธิ์เข้าถึง</div>';return}
 $('ct').innerHTML='<div class="empty">กำลังโหลด…</div>';
 await loadAll();
 let r0='';try{r0=localStorage.getItem('hb-role')||''}catch(e){}
 ROLE=ROLES.some(x=>x[0]===r0)?r0:'HEAD';
 $('role').innerHTML=ROLES.map(([k,t])=>`<option value="${esc(k)}">${esc(t)}</option>`).join('');$('role').value=ROLE;
 render();if(DBERR)toast('โหลดข้อมูลงานไม่สำเร็จ: '+DBERR);
})();
}
</script>
</body>
</html>
