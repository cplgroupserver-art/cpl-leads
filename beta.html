<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPL · หน้าหลัก Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Beta · follows CPL Lead Tracker Design System v1 (tokens copied from the parent page) */
:root{--bg:#fff;--card:#fff;--fld:#eef3f9;--tx:#0e2238;--mu:#62768c;--bd:#e0e8f0;--br:#0096d6;--pr:#0082c0;--lt:#52bdec;--nv:#0b2240;--ac:#f07d22;--ok:#11794a;--okb:#dff4ea;--wn:#a35a00;--wnb:#ffeedb;--er:#b42318;--erb:#fde6e3;--inf:#0072ac;--infb:#e0f3fc;--gy:#4a5b6e;--gyb:#e9eef3;--dgr:#e03131;--suc:#2fb170;
 --font:'Noto Sans Thai',system-ui,sans-serif;--grad-pr:linear-gradient(135deg,var(--br),var(--pr));
 --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:14px;--r-xl:18px;--r-pill:999px;--h-sm:32px;--h-md:40px;--h-tab:36px;--h-filter:30px;
 --sh-1:0 1px 2px rgba(15,35,60,.05),0 2px 8px rgba(15,35,60,.05);--sh-pop:0 24px 60px rgba(11,34,64,.35);--sh-pr:0 4px 12px rgba(0,150,214,.3);--sh-raise:0 1px 4px rgba(15,23,42,.14)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--font);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.sb,.mnav{display:none!important}
.app{display:block}.mn{display:block}
.tb{position:absolute;top:15px;right:72px;display:flex;align-items:center;gap:8px;z-index:2}
.tabs2{margin-right:280px}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.role select{min-height:var(--h-md);border-radius:var(--r-md);border:1px solid transparent;background:var(--fld);padding:0 12px;font-weight:500;color:var(--tx)}
.ct{padding:12px 28px 40px}
h1{font-size:18px;font-weight:700;margin:0;line-height:1.3}
.sub{color:var(--mu);font-size:13px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.hrow .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Button */
.btn{font:500 14px/1.2 var(--font);min-height:var(--h-md);padding:0 16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:var(--r-md);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--pr);color:var(--pr)}
.btn.p{background:var(--grad-pr);border:0;color:#fff;font-weight:600;padding:0 18px;box-shadow:var(--sh-pr)}.btn.p:hover{filter:brightness(1.07);color:#fff}
.btn.sm{min-height:var(--h-sm);font-size:13px;padding:0 12px}
.btn.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lt);outline-offset:1px}
/* Tabs (sub pages) */
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh-1);max-width:100%;overflow-x:auto}
.seg button{min-height:var(--h-tab);padding:0 18px;border:0;background:none;border-radius:var(--r-sm);color:var(--mu);font:500 14px/1.2 var(--font);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--grad-pr);color:#fff;font-weight:600}
.seg.flt{background:var(--fld);border:0;box-shadow:none;padding:3px;gap:2px}
.seg.flt button{min-height:var(--h-filter);padding:0 14px;font-size:13px}
.seg.flt button.on{background:var(--card);color:var(--pr);font-weight:600;box-shadow:var(--sh-raise)}
/* Segmented filter chips */
.chips{display:inline-flex;flex-wrap:nowrap;gap:2px;padding:3px;background:var(--fld);border-radius:var(--r-md);max-width:100%;overflow-x:auto}
.chips button{min-height:var(--h-filter);padding:0 14px;border:0;background:none;border-radius:var(--r-sm);color:var(--mu);font:500 13px/1.2 var(--font);cursor:pointer;white-space:nowrap}
.chips button{flex:none}.dlg .chips{flex-wrap:wrap;overflow:visible}
.chips button:hover{color:var(--tx)}.chips button.on{background:var(--card);color:var(--pr);font-weight:600;box-shadow:var(--sh-raise)}
.chips select.in{min-height:var(--h-filter)!important;height:var(--h-filter);background:var(--card);font-size:13px}
/* Layout */
.grid{display:grid;gap:14px}.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:1100px){.g2{grid-template-columns:1fr}}
/* Panel */
.pn{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1)}
.pn h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.pn h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--ac);flex:none}
.pn h3 .r{margin-left:auto;font:600 13px var(--font);color:var(--pr);background:none;border:0;cursor:pointer}
/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.st{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-1)}
.st::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--lt),var(--br))}
.st b{display:block;font-size:22px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{color:var(--mu);font-size:12px}
/* Target */
.tgt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:end}
.tgt .v{font-size:28px;font-weight:700;line-height:1.15;color:var(--tx);white-space:nowrap}
.meter{grid-column:1/-1;position:relative;height:10px;border-radius:var(--r-pill);background:var(--fld);margin:12px 0 14px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--lt),var(--br))}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mu);opacity:.6}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 8px}
.tiers div{border-radius:var(--r-md);background:var(--fld);padding:8px 12px;font-size:12px;border:1px solid transparent}
.tiers b{display:block;font-size:14px;font-weight:600;white-space:nowrap}.tiers span{color:var(--mu)}
.tiers .on{background:var(--okb);border-color:var(--ok)}.tiers .on b,.tiers .on span{color:var(--ok)}
.trend{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend i{width:100%;max-width:30px;border-radius:6px 6px 0 0;background:var(--c,var(--lt))}
.trend span{font-size:11px;color:var(--mu)}
/* Rows / lists */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .t{width:52px;flex:none;font-weight:600;font-size:13px;color:var(--inf)}.row .t.l{color:var(--dgr)}
.row h4{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mu)}.row .a{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}
.empty{color:var(--mu);font-size:13px;padding:8px 0}
.due{width:60px;flex:none;text-align:center;border-radius:var(--r-sm);padding:4px 0;line-height:1.25;background:var(--gyb);color:var(--gy)}
.due b{display:block;font-size:14px;font-weight:700}.due span{font-size:11px;font-weight:600}
.due.er{background:var(--erb);color:var(--er)}.due.wn{background:var(--wnb);color:var(--wn)}.due.inf{background:var(--infb);color:var(--inf)}
/* Tags */
.tag,.jst,.pay{display:inline-block;padding:2px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:500;white-space:nowrap;border:0;line-height:1.5}
button.jst,button.pay{cursor:pointer}
.tag.ok,.jst.ok,.pay.d{background:var(--okb);color:var(--ok)}.tag.wn,.jst.wn{background:var(--wnb);color:var(--wn)}.tag.er,.jst.er,.pay.p{background:var(--erb);color:var(--er)}.tag.gy,.jst.gy{background:var(--gyb);color:var(--gy)}.tag.inf,.jst.inf,.shr{background:var(--infb);color:var(--inf)}
.shr{display:inline-block;padding:1px 8px;border-radius:var(--r-pill);font-size:12px;font-weight:500;white-space:nowrap}
.code{display:inline-block;font:600 12px/1.5 ui-monospace,Menlo,monospace;border-radius:var(--r-xs);padding:1px 6px;background:var(--gyb);color:var(--c,var(--gy))}
.jno{font:600 12px/1.5 ui-monospace,Menlo,monospace;background:var(--gyb);color:var(--tx);border-radius:var(--r-xs);padding:1px 6px;white-space:nowrap}
.ro{font-size:11px;font-weight:600;color:var(--inf);background:var(--infb);border-radius:var(--r-pill);padding:1px 8px;white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:500;border-radius:var(--r-pill);padding:2px 10px;background:var(--gyb);color:var(--c,var(--gy));white-space:nowrap}
.lk{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}.lk:hover{color:var(--pr)}
.jlk{border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;color:var(--tx);display:block;text-align:left}
/* Info line */
.info{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;border-radius:var(--r-md);background:var(--infb);color:var(--tx);padding:10px 14px;margin-bottom:14px;font-size:13px}
.info>b{color:var(--inf);display:inline-flex;align-items:center;gap:6px;font-weight:600}.info>i{color:var(--mu);font-style:normal}
.info svg{width:16px;height:16px}
/* Payment */
.paysum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.paysum b{display:block;font-size:22px;font-weight:700;white-space:nowrap}.paysum span{font-size:12px;color:var(--mu)}
.pbar{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;background:var(--fld);margin:10px 0 6px}.pbar b{background:var(--suc)}.pbar i{background:var(--dgr)}
.bar{height:8px;border-radius:var(--r-pill);background:var(--fld);overflow:hidden;min-width:60px}.bar b{display:block;height:100%;border-radius:var(--r-pill);background:var(--c,var(--br))}
/* Table */
.scroll{overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{font-size:13px;font-weight:600;color:var(--mu);text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--bd)}
td{font-size:13px;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:nth-child(even){background:rgba(120,140,170,.11)}tbody tr:hover{background:var(--infb)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.nm{white-space:normal;min-width:140px}
.pn:has(>.scroll){padding:6px 8px}
/* Dialog */
dialog{border:0;border-radius:var(--r-xl);padding:0;width:min(760px,94vw);background:var(--card);color:var(--tx);box-shadow:var(--sh-pop);overflow:visible}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dx{position:absolute;left:calc(100% + 10px);top:0;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh-1);display:grid;place-items:center;color:var(--tx);font-size:16px;cursor:pointer}
@media(max-width:860px){.dx{left:auto;right:8px;top:8px;background:var(--fld);box-shadow:none}}
.dlg{padding:20px;max-height:90vh;overflow:auto}
.dlg h2{margin:0 0 14px;font-size:18px;font-weight:700}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--mu)}
.f>span .rq,.rq{color:var(--dgr);font-weight:600;margin-left:3px}
.in{min-height:var(--h-md);height:var(--h-md);border-radius:var(--r-md);background:var(--fld);border:1px solid transparent;padding:0 12px;font-size:14px;color:var(--tx);width:100%}
.in:focus{outline:2px solid var(--lt);border-color:var(--br)}
.nf{position:relative;display:block}.nf .in{padding-right:44px}.nf::after{content:attr(data-u);position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:13px;pointer-events:none}
.svg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}@media(max-width:600px){.svg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svg button{border:1px solid transparent;border-radius:var(--r-md);background:var(--fld);padding:8px 12px;text-align:left;cursor:pointer;min-height:52px;color:var(--tx);transition:.15s}
.svg button b{display:block;font-size:14px;font-weight:600}.svg button span{font-size:12px;color:var(--mu)}
.svg button.on{background:var(--infb);border-color:var(--br)}.svg button.on b{color:var(--pr)}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.four .c2{grid-column:span 2}.mono{font-family:ui-monospace,Menlo,monospace;font-weight:600}
@media(max-width:700px){.four{grid-template-columns:1fr 1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:600px){.two,.three{grid-template-columns:1fr}}
.sug{position:relative}.sug ul{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh-pop);z-index:3;max-height:240px;overflow:auto}
.sug li{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;color:var(--tx)}.sug li:hover,.sug li.on{background:var(--infb)}.sug li span{display:block;font-size:12px;color:var(--mu);font-weight:400}
.ltag{font-size:11px;font-weight:600;color:var(--wn);background:var(--wnb);border-radius:var(--r-pill);padding:1px 7px;margin-right:6px}
.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:var(--r-md);background:var(--infb);padding:8px 12px;margin:-4px 0 12px;font-size:13px}
.lnk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:var(--r-md);background:var(--okb);padding:8px 12px;margin:-4px 0 12px;font-size:13px}.lnk b{color:var(--ok)}.lnk button{margin-left:auto}
.sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:14px;margin-top:6px}
details summary{cursor:pointer;font-weight:600;color:var(--pr);margin:2px 0 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 16px;border-radius:var(--r-md);font-size:13px;box-shadow:var(--sh-pop);z-index:99;opacity:0;transition:opacity .15s;pointer-events:none}.toast.on{opacity:1}
@media(max-width:600px){.row{flex-wrap:wrap}.row .a{width:100%;justify-content:flex-end}.ct{padding:12px 14px 40px}.tb{position:static;padding:12px 14px 0;justify-content:flex-end}.tabs2{margin-right:0}}
</style>
</head>
<body>
<div class="app">
 <nav class="sb" id="sb" hidden></nav>
 <div class="mn">
  <header class="tb">
   <label class="role">ดูในมุมของ<select id="role" aria-label="ตำแหน่ง"></select></label>
  </header>
  <div class="mnav" id="mnav"></div>
  <main class="ct" id="ct"></main>
 </div>
</div>

<dialog id="dj" aria-labelledby="djt"><button class="dx" data-close aria-label="ปิด">✕</button><form class="dlg" id="fj" novalidate></form></dialog>
<dialog id="dc" aria-labelledby="dct"><button class="dx" data-close aria-label="ปิด">✕</button><form class="dlg" id="fc" novalidate></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(v,d=0)=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const B=v=>'฿ '+N(Math.round(v));
const TODAY=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
const MLBL=new Date().toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const DLBL=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)};

/* ---------- reference lists (from the TEXT sheet) ---------- */
const MODES=[['AX','Courier Express','พัสดุด่วน'],['AE','Courier Economy','พัสดุประหยัด'],['AD','Document','เอกสาร'],['AG','Air Cargo','ทางอากาศ'],['TL','Truck LTL','รถ · ไม่เต็มคัน'],['TF','Truck FTL','รถ · เต็มคัน'],['SL','Sea LCL','เรือ · ไม่เต็มตู้'],['SF','Sea FCL','เรือ · เต็มตู้']];
const SCOL=c=>c==='DOM'?'var(--gy)':c[0]==='E'?'var(--inf)':'var(--wn)';
const CTY=[['USA','สหรัฐฯ'],['DEU','เยอรมนี'],['JPN','ญี่ปุ่น'],['SGP','สิงคโปร์'],['MYS','มาเลเซีย'],['GBR','อังกฤษ'],['CHN','จีน'],['AUS','ออสเตรเลีย'],['VNM','เวียดนาม'],['LAO','ลาว'],['FRA','ฝรั่งเศส'],['CAN','แคนาดา'],['NZL','นิวซีแลนด์'],['CHE','สวิตเซอร์แลนด์'],['KOR','เกาหลีใต้'],['HKG','ฮ่องกง'],['TWN','ไต้หวัน'],['IND','อินเดีย'],['ARE','สหรัฐอาหรับฯ'],['THA','ไทย']];
const CH=['LINE@','LINE Private','FB PAGE','FB Private','CALL-IN','WHATAPP','E-MAIL','WEBSITE','WALK-IN (PLAZA)','WALK-IN (MIXT)','TIKTOK'];
const BR=['CPL','IMTH','CLMV','CPLExJJ','CPLExDEU','CPLExUSA','CPLExGBP','OVERSEA'];
const PT=['SPARE PART','CLOTHES','BEAUTY&PERSONAL CARE','INSTANT FOOD','PERSONAL EFFECT','ELECTRONIC','INDUSTRY EQUIPMENT','FASHION ACCESSORY','FOOD SUPPLEMENT','DECORATION','TOOLS','OTHER'];
const STS=['OPEN','DROP OFF','PICKUP','PACKED','BOOKING','BOOKED','RELEASED'];
const STC={OPEN:'gy','DROP OFF':'wn',PICKUP:'wn',PACKED:'wn',BOOKING:'inf',BOOKED:'inf',RELEASED:'ok',CANCELED:'er'};

/* ---------- people & targets (sample; November figures match DATA SALES 2026 / Weekly) ---------- */
const HB=(()=>{try{return parent!==window&&parent.HB}catch(e){return null}})();
const ST=HB?HB.ST:{Y:'ปิดการขาย',N:'ยังไม่สนใจบริการ',S:'รอการตัดสินใจ',H:'มีโอกาสเปลี่ยนใจ'};
let SALES=[],CUS=[],J=[],LD=[],seq=1,ROLES=[],DBERR='';const CB={},CKD={HO:[],BR:[]};
const comm=(v,s,cb)=>{cb=cb==null?v:cb;return !s.sal?[0,0]:v>=s.t2?[2,cb*.02]:v>=s.t1?[1,cb*.01]:[0,0]};
const MK=[],MON=[];{const d=new Date();d.setDate(1);for(let i=8;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);MK.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));MON.push(x.toLocaleDateString('th-TH',{month:'short'}))}}
const CUR=MK[8],inM=(j,k)=>(j.rm||j.close||j.open||'').startsWith(k);
const LST={[ST.S]:'var(--wn)',[ST.H]:'var(--inf)',[ST.Y]:'var(--ok)'};

 <div class="f"><span>COUNTRY <b class="rq">*</b></span><select class="in mono" id="jcty">${opt(cc,F.cty,'—')}</select></div>
 <div class="f"><span>CLOSED DATE <b class="rq">*</b></span><input class="in" id="jclose" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" value="${fd(F.close)}"></div></div>
 <div class="four"><div class="f"><span>INCOME</span><span class="nf" data-u="บาท"><input class="in" id="jinc" inputmode="decimal" value="${F.inc?N(F.inc,2):''}"></span></div>
 <div class="f"><span>INCOME NET</span><span class="nf" data-u="บาท"><input class="in" id="jnet" inputmode="decimal" value="${F.net?N(F.net,2):''}"></span></div>
 <div class="f"><span>STATUS</span><select class="in" id="jst">${opt(STA,F.st)}</select></div>
 <div class="f"><span>PAYMENT</span><select class="in" id="jpay">${opt([['d','DONE'],['p','PENDING']],F.pay)}</select></div></div>
 <div class="four"><div class="f"><span>SALES <b class="rq">*</b></span><select class="in" id="jsl">${opt(SALES.map(x=>x.id),F.s)}</select></div>
 <div class="f"><span>ASSIST</span><select class="in" id="jas">${opt(SALES.filter(x=>x.id!==F.s).map(x=>x.id),F.as,'—')}</select></div>
 <div class="f"><span>OPEN DATE</span><input class="in" id="jopen" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" value="${fd(F.open)}"></div>
 <div class="f"><span>NEW/OLD</span><select class="in" id="jnew">${opt([['ใหม่','NEW'],['เก่า','OLD']],F.no||'ใหม่')}</select></div></div>
 <details${F._edit?' open':''}><summary>รายละเอียดเพิ่มเติม</summary>
 <div class="four"><div class="f"><span>SO/SJ</span><input class="in" id="jso" value="${esc(F.so)}"></div>
 <div class="f"><span>CHANNEL</span><select class="in" id="jch">${opt(CH.includes(F.ch)||!F.ch?CH:[F.ch,...CH],F.ch,'—')}</select></div>
 <div class="f"><span>BRANCH</span><select class="in" id="jbr">${opt(BR.includes(F.br)||!F.br?BR:[F.br,...BR],F.br)}</select></div>
 <div class="f"><span>PRODUCT TYPE</span><select class="in" id="jpt">${opt(PT.includes(F.pt)||!F.pt?PT:[F.pt,...PT],F.pt,'—')}</select></div>
 <div class="f"><span>SOURCE</span><select class="in" id="jsrc">${opt(['',...new Set(['ลูกค้าเก่า',...LD.map(l=>l.ads),'Ads: Inbox','CALL-IN','WALK-IN (PLAZA)',F.src].filter(Boolean))],F.src)}</select></div>
 <div class="f"><span>AWB/BL</span><input class="in" id="jawb" value="${esc(F.awb)}"></div>
 <div class="f c2"><span>REMARK</span><input class="in" id="jrem" value="${esc(F.remark)}"></div></div></details>
 <div class="sum"><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn p" type="submit">บันทึก</button></span></div>`;
}
const pnum=v=>+String(v).replace(/[^\d.]/g,'')||0;
function pickCus(c,q){F.cus=c.n;F.code=c.code;F.cid=c.id;F.ch=c.ch;F.br=c.br;F.no=J.some(j=>j.cus===c.n)?'เก่า':'ใหม่';F.src=F.no==='เก่า'?'ลูกค้าเก่า':(c.leadSrc||'');F.lead=c.leadId||'';F._last=c.last;F._hint=c.last?`ส่งล่าสุด ${c.last.sv} · ${c.last.c}`:'';if(!q)drawJob()}
function pickLead(l,q){F.sv='';F.cus=l.n;F.lead=l.id;F.src=l.ads;F.ch=l.ch;F.no='ใหม่';F.io=l.sv[0]==='D'?'E':l.sv[0];F.mode=l.sv==='DOM'?'DOM':l.sv.slice(1);F.cty=l.cty;F.s=F.s||l.s;F._hint='';F.code='';F.cid=l.cid||null;if(!q)drawJob()}
const nextNo=()=>TODAY.slice(2,4)+TODAY.slice(5,7)+'-'+String(seq).padStart(4,'0');
const fj=$('fj');
const nk=t=>String(t||'').toLowerCase().replace(/บริษัท|จำกัด|\(มหาชน\)|co\.?|ltd\.?|limited|คุณ/g,'').replace(/[^a-z0-9ก-๙]/g,'');
const sim=(a,b)=>{a=nk(a);b=nk(b);if(!a||!b)return 0;if(a===b)return 1;const g=x=>{const m=new Map();for(let i=0;i<x.length-1;i++){const k=x.slice(i,i+2);m.set(k,(m.get(k)||0)+1)}return m},A=g(a),B=g(b);let n=0;A.forEach((v,k)=>{n+=Math.min(v,B.get(k)||0)});return 2*n/Math.max(1,a.length-1+b.length-1)};
function ldSug(q){const ul=$('jldsug');if(!ul)return;const ref=F.open||F.close||TODAY,dd=l=>Math.abs((Date.parse(l.in)-Date.parse(ref))/864e5);
 let L=LD.filter(l=>!J.some(j=>String(j.lead)===String(l.id)&&String(j.id)!==String(F.id)));
 L=q?L.filter(l=>nk(l.n).includes(nk(q))):L.map(l=>[l,sim(l.n,F.cus)+(l.s===F.s?.1:0)-Math.min(.3,dd(l)/400)]).filter(x=>x[1]>.25).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
 L=L.slice(0,6);ul.hidden=!L.length;ul.innerHTML=L.map(l=>`<li data-ll="${l.id}"><b class="ltag">Lead</b>${esc(l.n)}<span>${fd(l.in)} · ${esc(l.ads)} · ${esc(l.st)} · ${esc(l.s)}</span></li>`).join('')}
fj.addEventListener('focusin',e=>{if(e.target.id==='jld')ldSug(e.target.value.trim())});
fj.addEventListener('input',e=>{if(e.target.id==='jld')ldSug(e.target.value.trim())});
fj.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='jcus'){F.cus=t.value;F._hint='';F.cid=null;F.no=t.value?'ใหม่':'';if(F.lead){F.lead='';F.src=''}const q=t.value.trim().toLowerCase(),ul=$('jsug');const L=q?CUS.filter(c=>c.n.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)).slice(0,5):[];const LL=q?LD.filter(l=>!J.some(j=>j.lead===l.id)&&l.n.toLowerCase().includes(q)).slice(0,4):[];ul.hidden=!(L.length+LL.length);ul.innerHTML=[...LL.map(l=>`<li data-li="${l.id}"><b class="ltag">Lead</b>${esc(l.n)}<span>${fd(l.in)} · ${esc(l.ads)} · ${esc(l.st)} · ${esc(l.s)}</span></li>`),...L.map(c=>`<li data-cu="${CUS.indexOf(c)}">${esc(c.n)}<span>${c.last?`ส่งล่าสุด ${c.last.sv} ${c.last.c}`:'ลูกค้า'} · ${esc(c.s)}</span></li>`)].join('');const f=ul.querySelector('li');if(f)f.classList.add('on')}
 if(t.id==='jinc'){F.inc=pnum(t.value);F.net=vatNet(F.inc,F.br);$('jnet').value=F.inc?N(F.net,2):''}
 if(t.id==='jnet')F.net=pnum(t.value);
 if(t.id==='jclose'||t.id==='jopen'){let v=t.value.replace(/[^\d]/g,'').slice(0,8);t.value=v.length>4?v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4):v.length>2?v.slice(0,2)+'/'+v.slice(2):v;const m=t.value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);F[t.id==='jclose'?'close':'open']=m?m[3]+'-'+m[2]+'-'+m[1]:''}if(t.id==='jno')F.job=t.value;
});
fj.addEventListener('change',e=>{const t=e.target;if(t.id==='jsl'){F.s=t.value;if(F.as===F.s)F.as='';drawJob();return}if(t.id==='jas'){F.as=t.value;drawJob();return}const m={jsv:'sv',jst:'st',jpay:'pay',jnew:'no',jno:'job',jcty:'cty',jso:'so',jch:'ch',jbr:'br',jpt:'pt',jawb:'awb',jrem:'remark',jsrc:'src'};if(m[t.id]){F[m[t.id]]=t.value;if(t.id==='jbr'&&F.inc){F.net=vatNet(F.inc,F.br);$('jnet').value=N(F.net,2)}}});
fj.addEventListener('keydown',e=>{if(e.target.id==='jcus'&&e.key==='Enter'){e.preventDefault();const li=$('jsug').querySelector('li.on');if(li&&!$('jsug').hidden){if(li.dataset.li)pickLead(LD.find(x=>String(x.id)===li.dataset.li));else pickCus(CUS[+li.dataset.cu])}}});
fj.addEventListener('click',e=>{const b=e.target.closest('button,li');if(!b)return;const d=b.dataset;
 if(d.ll){const l=LD.find(x=>String(x.id)===d.ll);if(l){F.lead=l.id;if(!F.src)F.src=l.ads;drawJob()}return}
 if(d.li)return pickLead(LD.find(x=>String(x.id)===d.li));if(d.cu!=null)return pickCus(CUS[+d.cu]);if(d.unl!=null){F.lead='';F.src='';drawJob();return}
 if(d.rep!=null){F.sv='';F.io=F._last.sv[0];F.mode=F._last.sv==='DOM'?'DOM':F._last.sv.slice(1);F.cty=F._last.c;F.pt=F._last.pt;F._hint='';drawJob();return}
 if(d.io){if(d.io==='D')F.mode='DOM';else{F.io=d.io;if(F.mode==='DOM')F.mode='AX'}drawJob()}
 else if(d.md){F.mode=d.md;drawJob()}else if(d.cty){F.cty=d.cty;drawJob()}else if(d.st){F.st=d.st;drawJob()}else if(d.py){F.pay=d.py;drawJob()}
});
fj.addEventListener('submit',async e=>{e.preventDefault();
 if(!F.cus.trim()){toast('กรุณาใส่ชื่อลูกค้า');$('jcus').focus();return}
 if(!F.cty){toast('กรุณาเลือกประเทศ');return}
 const no=(F.job||(F._edit?'':nextNo())).trim();if(!no){toast('กรุณาใส่ Job No.');return}
 if(!F.close){toast('กรุณาใส่ Close Date');$('jclose').focus();return}
 const o={job:no,s:F.s,as:F.as||'',lead:F.lead||'',cid:F.cid||null,src:F.src||'',cus:F.cus.trim(),sv:svCode(),cty:F.cty,inc:+F.inc||0,net:+F.net||0,no:F.no||'ใหม่',ch:F.ch,br:F.br,st:F.st,pay:F.pay,open:F.open,close:F.close,pt:F.pt,awb:F.awb,so:F.so,remark:F.remark};
 const btn=fj.querySelector('[type=submit]');btn.disabled=true;
 const sb=HB.sb();
 if(!F._edit&&!o.cid){const ex=CUS.find(c=>c.n.trim().toLowerCase()===o.cus.toLowerCase());if(ex)o.cid=ex.id;else{const{data:c}=await sb.from('customers').insert({name:o.cus,owner:o.s||null}).select('id').single();if(c)o.cid=c.id}}
 const q=F._edit?sb.from('sales_jobs').update(toRow(o)).eq('id',F.id):sb.from('sales_jobs').insert(toRow(o));
 const{error}=await q;
 if(error){btn.disabled=false;toast('บันทึกไม่สำเร็จ: '+error.message);return}
 if(!F._edit&&o.lead&&!F._conv){try{const{data:l}=await sb.from('leads').select('status,deal_amt,detail,customer_id').eq('id',o.lead).single();if(l){const dt={...(l.detail||{})},g=MG(o.sv),sv=g==='Sea'?'Sea':g==='Truck'?'Truck':'Air',dir=o.sv[0]==='I'?'นำเข้า':'ส่งออก',up={status:ST.Y};
  if(!+l.deal_amt&&!(dt.deals||[]).length){up.deal_amt=o.net||o.inc||0;up.deal_date=o.close;dt.cl={dir,svc:sv,cty:cname(o.cty)}}else dt.deals=[...(dt.deals||[]),{d:o.close,a:o.net||o.inc||0,dr:dir,s:sv,c:cname(o.cty)}];
  up.detail=dt;if(!l.customer_id&&o.cid)up.customer_id=o.cid;await sb.from('leads').update(up).eq('id',o.lead)}}catch(e){}}
 btn.disabled=false;
 toast(F._edit?'บันทึกแล้ว':'ลงงาน '+no+' แล้ว');$('dj').close();await reload()});

/* ---------- new customer (quick) ---------- */
let SALID='';
function openSal(id){SALID=id;const s=SALES.find(x=>x.id===id);$('fc').innerHTML=`<h2 id="dct">เงินเดือน · ${esc(id)}</h2><div class="sub" style="margin-bottom:14px">${esc(s.team)}</div><div class="f"><span>เงินเดือน (บาท) <b class="rq">*</b></span><span class="nf" data-u="บาท"><input class="in" id="csal" inputmode="decimal" value="${s.sal?N(s.sal):''}"></span></div><div class="sum"><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn p" type="submit">บันทึก</button></span></div>`;$('dc').showModal();setTimeout(()=>$('csal').focus(),50)}
$('fc').addEventListener('submit',async e=>{e.preventDefault();const v=pnum($('csal').value);if(!v){toast('กรุณาใส่เงินเดือน');return}
 const{error}=await HB.sb().from('sales_targets').upsert({sales:SALID,salary:v,updated_at:new Date().toISOString()});if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}
 $('dc').close();toast('บันทึกแล้ว');await reload()});
document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.close()})});

/* ---------- page actions ---------- */
$('ct').addEventListener('click',e=>{const sb=e.target.closest('[data-sub]');if(sb){PAGE=sb.dataset.sub;return render()}const b=e.target.closest('[data-nj],[data-nc],[data-adv],[data-pay],[data-ej],[data-go],[data-jv],[data-fil],[data-ck],[data-cbd],[data-ld],[data-lj],[data-lfil],[data-cx],[data-cj],[data-sal],[data-ld2],[data-cu2]');if(!b)return;const d=b.dataset;
 if(d.nj!=null)return openJob();if(d.lj)return openJob(null,LD.find(x=>String(x.id)===d.lj));if(d.sal)return openSal(d.sal);if(d.lfil){LFIL=d.lfil;return render()}if(d.cx){COPEN=COPEN===d.cx?'':d.cx;return render()}if(d.cj)return openJob(null,null,CUS.find(c=>c.code===d.cj));
 if(d.go==='lead'){try{HB.go('L')}catch(e){}return}if(d.go){PAGE=d.go;return render()}if(d.ld2){try{HB.lead(+d.ld2||d.ld2)}catch(e){}return}if(d.cu2){try{HB.cus(d.cu2)}catch(e){}return}if(d.jv){JV=d.jv;return render()}if(d.fil){FIL=d.fil;return render()}
 const j=J.find(x=>String(x.id)===(d.adv||d.pay||d.ej));
 if(j&&j.ro&&(d.adv||d.pay))return toast('รายการนี้มาจาก Lead');if(j&&j.ro&&d.ej)return openJob({...j,id:null,job:'',ro:0,_conv:1});
 if(d.adv&&j){const i=STS.indexOf(j.st),st=STS[Math.min(STS.length-1,i+1)];return upd(j,{status:st},()=>{j.st=st;toast(j.job+' → '+st)})}
 if(d.pay&&j){const p=j.pay==='d'?'p':'d';return upd(j,{pay:p},()=>{j.pay=p;toast(j.job+(p==='d'?' ชำระแล้ว':' ค้างชำระ'))})}
 if(d.ej&&j)return openJob(j);
 if(d.ck!=null){const L=CKD[(me()||{}).br==='CPLExJJ'?'BR':'HO'][+d.ck];L[1]=L[1]>=L[2]?0:L[2];return render()}
 if(d.cbd!=null){CB[ROLE].splice(+d.cbd,1);toast('บันทึกผลการโทรแล้ว');return render()}
 if(d.ld!=null){b.closest('.row').remove();toast('ย้ายไปติดตามแล้ว')}
});
async function upd(j,o,ok){const{error}=await HB.sb().from('sales_jobs').update(o).eq('id',j.id);if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}ok();render()}
async function reload(){await loadAll();render()}
(async()=>{
 try{const pd=parent.document.documentElement,t=pd.dataset.theme;if(t)document.documentElement.dataset.theme=t;const cs=parent.getComputedStyle(pd),me=document.documentElement.style;['bg','card','fld','tx','mu','bd','br','pr','lt','nv','ac','ok','okb','wn','wnb','er','erb','inf','infb','gy','gyb','dgr','suc','sh','sh-1','sh-pop','sh-pr','sh-raise','r-xs','r-sm','r-md','r-lg','r-xl'].forEach(k=>{const v=cs.getPropertyValue('--'+k).trim();if(v)me.setProperty('--'+k,v)});if(cs.getPropertyValue('--sh').trim())me.setProperty('--sh-1',cs.getPropertyValue('--sh').trim());document.documentElement.style.colorScheme=t==='dark'?'dark':'light'}catch(e){}
 if(!HB||!HB.profile()){$('ct').innerHTML='<div class="empty">ไม่มีสิทธิ์เข้าถึง</div>';return}
 $('ct').innerHTML='<div class="empty">กำลังโหลด…</div>';
 await loadAll();
 let r0='';try{r0=localStorage.getItem('hb-role')||''}catch(e){}
 ROLE=ROLES.some(x=>x[0]===r0)?r0:'HEAD';
 $('role').innerHTML=ROLES.map(([k,t])=>`<option value="${esc(k)}">${esc(t)}</option>`).join('');$('role').value=ROLE;
 render();if(DBERR)toast('โหลดข้อมูลงานไม่สำเร็จ: '+DBERR);
})();
}
</script>
</body>
</html>
